<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Cannot reach server</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", system-ui, sans-serif; background: #f4f6f8; color: #1f1f1f;
  }
  .card { width: 470px; background: #fff; padding: 40px 38px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.09); }
  h1 { font-size: 19px; margin: 0 0 10px; }
  p { font-size: 13.5px; line-height: 1.6; color: #555; margin: 0 0 8px; }
  code { background: #f0f2f4; padding: 2px 6px; border-radius: 4px; font-size: 12px; word-break: break-all; }
  ul { font-size: 13px; color: #555; line-height: 1.7; padding-left: 20px; margin: 14px 0 0; }
  .actions { margin-top: 26px; display: flex; gap: 10px; }
  button { flex: 1; padding: 11px; font-size: 13.5px; font-weight: 600; font-family: inherit; border-radius: 7px; cursor: pointer; border: 0; }
  .primary { background: #0082c9; color: #fff; }
  .primary:hover { background: #00679e; }
  .secondary { background: #eceff1; color: #333; }
  .secondary:hover { background: #dfe3e6; }
</style>
</head>
<body>
  <div class="card">
    <h1>Cannot reach the server</h1>
    <p id="detail"></p>
    <ul>
      <li>Check your network connection, and your VPN if the instance needs one.</li>
      <li>Confirm the Nextcloud instance is running and reachable.</li>
      <li>If you use a self-signed certificate, enable that option for this server in the server manager.</li>
    </ul>
    <div class="actions">
      <button class="primary" id="retry">Retry</button>
      <button class="secondary" id="setup">Manage servers</button>
    </div>
  </div>
<script>
  var params = new URLSearchParams(location.search);
  var clean = function (value) { return String(value || '').replace(/[<>&]/g, ''); };

  document.getElementById('detail').innerHTML =
    'The client could not load <code>' + clean(params.get('url')) + '</code>.<br>' +
    'Details: ' + clean(params.get('description')) + ' (' + clean(params.get('code')) + ')';

  document.getElementById('retry').addEventListener('click', function () {
    if (window.nextcloudHub) window.nextcloudHub.retry(params.get('server'));
  });
  document.getElementById('setup').addEventListener('click', function () {
    if (window.nextcloudHub) window.nextcloudHub.openSetup();
  });
</script>
</body>
</html>
