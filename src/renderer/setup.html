<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Servers - Nextcloud Hub</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 26px 24px;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(150deg, #00679e 0%, #0082c9 60%, #00a0e3 100%);
    color: #1a1a1a;
  }
  .card { background: #fff; border-radius: 12px; padding: 26px 24px; box-shadow: 0 14px 40px rgba(0,0,0,.25); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 12.5px; color: #666; margin: 0 0 20px; line-height: 1.5; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: #888; margin: 24px 0 10px; }
  label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #444; }
  input[type=text] {
    width: 100%; padding: 10px 12px; font-size: 13.5px; font-family: inherit;
    border: 2px solid #dcdcdc; border-radius: 7px; outline: none;
  }
  input[type=text]:focus { border-color: #0082c9; }
  .row { margin-bottom: 14px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #555; font-weight: 400; }
  .hint { font-size: 11px; color: #8a8a8a; margin-top: 6px; line-height: 1.45; }
  button { font-family: inherit; border: 0; border-radius: 7px; cursor: pointer; font-weight: 600; }
  .primary { background: #0082c9; color: #fff; width: 100%; padding: 10px 16px; font-size: 13.5px; margin-top: 4px; }
  .primary:hover:not(:disabled) { background: #00679e; }
  .primary:disabled { background: #a8cfe4; cursor: default; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border: 1px solid #e6e6e6; border-radius: 8px; margin-bottom: 8px; padding: 11px 12px; }
  .head { display: flex; align-items: center; gap: 11px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
  .info { flex: 1; min-width: 0; }
  .name { font-size: 13.5px; font-weight: 600; }
  .url { font-size: 11.5px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acts { display: flex; gap: 6px; margin-top: 9px; }
  .mini { padding: 6px 11px; font-size: 11.5px; flex: 1; }
  .open { background: #eef4f9; color: #0d6a9e; }
  .out  { background: #fff5e8; color: #96601a; }
  .del  { background: #fbeeee; color: #a33; }
  .empty { font-size: 12.5px; color: #999; padding: 14px 0; text-align: center; }
  .msg { margin-top: 13px; padding: 10px 12px; border-radius: 7px; font-size: 12.5px; display: none; line-height: 1.45; }
  .msg.error { display: block; background: #fdeaea; color: #99231f; border: 1px solid #f2c4c2; }
  .msg.info  { display: block; background: #eaf4fb; color: #14587f; border: 1px solid #c2ddf0; }
  .msg.ok    { display: block; background: #ecf8ee; color: #256b32; border: 1px solid #c7e6cd; }
</style>
</head>
<body>
  <div class="card">
    <h1>Nextcloud servers</h1>
    <p class="sub">Each server keeps its own isolated session, so you can stay signed in to several instances at once, each in its own window.</p>

    <h2>Registered servers</h2>
    <ul id="list"></ul>
    <div class="empty" id="empty">No servers yet.</div>

    <h2>Add a server</h2>
    <div class="row">
      <label for="url">Address</label>
      <input id="url" type="text" placeholder="cloud.example.com" autocomplete="off" spellcheck="false">
      <div class="hint">https:// is added automatically. A subpath such as example.com/nextcloud works too.</div>
    </div>
    <div class="row">
      <label for="label">Display name (optional)</label>
      <input id="label" type="text" placeholder="Personal, Work..." autocomplete="off">
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="insecure"> Accept a self-signed certificate</label>
    </div>
    <button class="primary" id="add">Add and open</button>
    <div id="msg" class="msg"></div>
  </div>

<script>
  var list = document.getElementById('list');
  var empty = document.getElementById('empty');
  var msg = document.getElementById('msg');
  var addBtn = document.getElementById('add');
  var urlInput = document.getElementById('url');
  var labelInput = document.getElementById('label');
  var insecureInput = document.getElementById('insecure');

  var bridge = window.nextcloudHub;

  function show(text, kind) {
    msg.textContent = text;
    msg.className = 'msg ' + kind;
  }

  // If the bridge is missing the window has no IPC at all; say so instead of
  // hanging on a spinner forever.
  if (!bridge) {
    show('Internal error: the application bridge did not load. Please restart Nextcloud Hub.', 'error');
    addBtn.disabled = true;
  }

  function button(cls, text, onClick) {
    var b = document.createElement('button');
    b.className = 'mini ' + cls;
    b.textContent = text;
    b.addEventListener('click', onClick);
    return b;
  }

  function render(servers) {
    list.innerHTML = '';
    empty.style.display = servers.length ? 'none' : 'block';

    servers.forEach(function (server) {
      var li = document.createElement('li');

      var head = document.createElement('div');
      head.className = 'head';

      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = server.color || '#0082c9';

      var info = document.createElement('div');
      info.className = 'info';
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = server.label;
      var url = document.createElement('div');
      url.className = 'url';
      url.textContent = server.url;
      info.appendChild(name);
      info.appendChild(url);

      head.appendChild(dot);
      head.appendChild(info);

      var acts = document.createElement('div');
      acts.className = 'acts';
      acts.appendChild(button('open', 'Open', function () {
        bridge.openServer(server.id);
      }));
      acts.appendChild(button('out', 'Sign out', function () {
        bridge.signOut(server.id).then(function (result) {
          if (result && result.ok) show('Signed out of ' + server.label + '.', 'ok');
          else if (result && result.error) show(result.error, 'error');
        });
      }));
      acts.appendChild(button('del', 'Remove', function () {
        bridge.removeServer(server.id).then(function (result) {
          if (result && result.ok) { refresh(); show('Server removed.', 'ok'); }
          else if (result && result.error) show(result.error, 'error');
        });
      }));

      li.appendChild(head);
      li.appendChild(acts);
      list.appendChild(li);
    });
  }

  function refresh() {
    if (!bridge) return;
    bridge.listServers().then(render).catch(function () {
      show('Could not read the server list.', 'error');
    });
  }

  function submit() {
    if (!bridge) return;
    var value = urlInput.value.trim();
    if (!value) { show('Please enter an address.', 'error'); return; }

    addBtn.disabled = true;
    addBtn.textContent = 'Checking...';
    show('Contacting the server...', 'info');

    var done = false;
    // The main process always answers, but never leave the UI stuck if it does not.
    var guard = setTimeout(function () {
      if (done) return;
      done = true;
      addBtn.disabled = false;
      addBtn.textContent = 'Add and open';
      show('No response from the application. Please try again.', 'error');
    }, 20000);

    bridge.addServer({
      url: value,
      label: labelInput.value,
      allowInsecureCertificates: insecureInput.checked
    }).then(function (result) {
      if (done) return;
      done = true; clearTimeout(guard);
      addBtn.disabled = false;
      addBtn.textContent = 'Add and open';
      if (!result.ok) { show(result.error, 'error'); return; }
      urlInput.value = '';
      labelInput.value = '';
      insecureInput.checked = false;
      show('Server added' + (result.version ? ' (' + result.version + ')' : '') + '.', 'ok');
      refresh();
    }).catch(function (err) {
      if (done) return;
      done = true; clearTimeout(guard);
      addBtn.disabled = false;
      addBtn.textContent = 'Add and open';
      show('Unexpected error: ' + (err && err.message ? err.message : 'unknown'), 'error');
    });
  }

  addBtn.addEventListener('click', submit);
  urlInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  labelInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });

  refresh();
  urlInput.focus();
</script>
</body>
</html>
